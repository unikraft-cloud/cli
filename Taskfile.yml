# https://taskfile.dev
version: 3

includes:
  go:
    taskfile: https://github.com/unikraft-cloud/x.git//Taskfile.go.yml?ref=prod-staging
    vars:
      goreleaser_version: v2.13.3

vars:
  go_bin:
    ref: .go_bin | default "go"

  workdir:
    sh: pwd
  distdir: "{{.workdir}}/dist"

  ytt_version: v0.52.0
  ytt_bin: "{{.go_bin}} run carvel.dev/ytt/cmd/ytt@{{.ytt_version}}"

  # HACK: hot-fix for svu, see go.mod replace
  # svu_version: v3.2.3
  # svu_bin: "{{.go_bin}} run github.com/caarlos0/svu/v3@{{.svu_version}}"
  svu_bin: "{{.go_bin}} run github.com/caarlos0/svu/v3"

  task_version: v3.48.0
  task_bin:
    sh: command -v task >/dev/null 2>&1 && echo "task --yes" || echo "{{.go_bin}} run github.com/go-task/task/v3/cmd/task@{{.task_version}} --yes"

tasks:
  default:
    cmds:
    - task: cli

  cli:
    desc: The `unikraft` CLI.
    silent: true
    cmds:
    - task: go:build
      vars:
        package: ./cmd/unikraft
        name: unikraft-cli
        docs: https://unikraft.com/docs/cli
        issues: https://github.com/unikraft-cloud/cli/issues

  lint:
    desc: Lint the project.
    silent: true
    cmds:
      - task: go:lint
        vars:
          disable: [""]

  license:
    desc: Check the project licensing.
    silent: true
    cmds:
      - task: go:license

  unit:
    aliases: [test]
    desc: Run unit tests.
    silent: true
    cmds:
    - task: go:test

  unit-race:
    desc: Run unit tests with the race detector.
    silent: true
    cmds:
    - task: go:test
      vars:
        CLI_ARGS: "-race"

  integration:
    desc: >-
      Run integration tests. Use TEST=<pattern> to filter (e.g., TEST=Instances).
      Use RERUN_FAILS=<n> to retry individual failed tests up to n times.
    silent: true
    vars:
      integration_package: ./cmd/unikraft/integration ./internal/builder
    cmds:
    - task: go:test
      vars:
        go_tags: "integration"
        package: "{{.integration_package}}"
        CLI_ARGS: '{{if .TEST}}-run "{{.TEST}}"{{end}}'
        gotestsum_args: '{{if .RERUN_FAILS}}--rerun-fails={{.RERUN_FAILS}} --packages="{{.integration_package}}"{{end}}'

  golden:
    desc: Run offline golden tests.
    cmd: >-
      {{.go_bin}} test -v ./cmd/unikraft ./internal/cmd -run "TestHelp|TestOutput"

  golden-update:
    desc: Update golden files for offline tests.
    cmd: >-
      {{.go_bin}} test -v ./cmd/unikraft ./internal/cmd --update -run "TestHelp|TestOutput"

  docs:
    desc: Generate all documentation.
    silent: true
    deps:
    - task: docs:man
    - task: docs:mdx

  docs:man:
    desc: Generate man page documentation.
    silent: true
    cmd: |
      {{.go_bin}} run {{.workdir}}/tools/gendocs man --compress {{.workdir}}/dist/docs/man
    generates:
    - "{{.workdir}}/dist/docs/man/**/*"

  docs:mdx:
    desc: Generate markdown documentation.
    silent: true
    cmd: |
      {{.go_bin}} run {{.workdir}}/tools/gendocs mdx {{.workdir}}/dist/docs/mdx
    generates:
    - "{{.workdir}}/dist/docs/mdx/**/*"

  goreleaser.yaml:
    desc: Generate the GoReleaser configuration file.
    sources:
    - .goreleaser.ytt
    generates:
    - .goreleaser.yaml
    cmds:
    - |
      cat {{.workdir}}/.goreleaser.ytt | {{.ytt_bin}} --data-values-env YTT -f- > {{.workdir}}/.goreleaser.yaml

  hash-version:
    desc: Show the version of the CLI based on repo state.
    silent: true
    cmds:
    - |
      HASH_COMMIT=HEAD
      HASH=$(git update-index -q --refresh && git describe --tags)
      DIRTY=$(git update-index -q --refresh && git diff-index --quiet HEAD -- {{.WORKDIR}} || echo "-dirty")
      echo "${HASH}${DIRTY}"

  last-version:
    desc: Show the last version of the CLI.
    silent: true
    cmds:
    - |
      {{.svu_bin}} current

  next-stable:
    desc: Show the next stable version of the CLI.
    silent: true
    cmds:
    - |
      PRERELEASE="${PRERELEASE:-}"
      {{.svu_bin}} next --always --v0 --tag.prefix "v" --tag.pattern "v[0-9]*.[0-9]*.[0-9]*" --prerelease "$PRERELEASE"

  next-staging:
    desc: Show the next staging version of the CLI.
    silent: true
    cmds:
    - |
      NEXT=$({{.svu_bin}} current)
      if [[ "$NEXT" == *"staging"* ]]; then
        NEXT=$(echo "$NEXT" | awk -F. '{print $1 "." $2 "." $3 "." $4 + 1}')
      else
        NEXT=$(PRERELEASE=staging.1 {{.task_bin}} next-stable)
      fi
      echo $NEXT

  last-stable:
    desc: Show the last stable version of the CLI.
    silent: true
    cmds:
    - git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude='*-*' --abbrev=0

  snapshot:
    desc: Generate a snapshot release.
    silent: true
    deps:
    - goreleaser.yaml
    cmds:
    - |
      {{.goreleaser_bin}} release \
        --snapshot \
        --skip=publish \
        --clean

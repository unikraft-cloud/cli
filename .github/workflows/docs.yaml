name: docs

on:
  push:
    branches:
    - prod-staging
    paths:
    - '**'
    - '!.github/**'
    - '.github/workflows/docs.yaml'
    - '!README.md'
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - prod-staging
    paths:
    - '**'
    - '!.github/**'
    - '.github/workflows/docs.yaml'
    - '!README.md'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: Set Go variables
      id: goenv
      run: |
        {
          echo "cache=$(go env GOCACHE)"
          echo "modcache=$(go env GOMODCACHE)"
          echo "mod=$(go env GOMOD)"
        } >>"$GITHUB_OUTPUT"

    - name: Go caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
        key: ${{ github.job }}-${{ runner.os }}-go-${{ hashFiles(steps.goenv.outputs.mod) }}
        restore-keys: |
          ${{ github.job }}-${{ runner.os }}-go-

    - name: Build docs
      shell: bash
      run: |
        make docs

    - name: Upload docs artifacts to GitHub
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: github.event_name == 'push'
      with:
        name: unikraft-docs-${{ github.event.pull_request.number || github.sha }}
        path: ./dist/docs/mdx
        if-no-files-found: error
        retention-days: 7
        overwrite: true

    - name: Upload man artifacts to GitHub
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: github.event_name == 'push'
      with:
        name: unikraft-man-${{ github.sha }}
        path: ./dist/docs/man
        if-no-files-found: error
        retention-days: 7
        overwrite: true

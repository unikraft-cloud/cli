name: mirror

on:
  push:
    branches:
    - prod-*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Fetch all tags
      shell: bash
      run: git fetch --force --tags

    - name: Push to public mirror
      shell: bash
      run: |
        git remote add mirror https://x-access-token:${{ secrets.GH_MIRROR_PAT }}@github.com/unikraft/cli.git
        git push --force mirror HEAD:refs/heads/${{ github.ref_name }} --tags

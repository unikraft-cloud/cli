name: test
permissions:
  contents: read

on:
  push:
    branches: [prod-staging, prod-stable]
  pull_request:
    branches: [prod-staging]
    paths:
    - '**'
    - '!.github/**'
    - '.github/workflows/test.yaml'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - name: Authenticate git for remote Taskfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set Go variables
        id: goenv
        run: |
          {
            echo "cache=$(go env GOCACHE)"
            echo "modcache=$(go env GOMODCACHE)"
            echo "mod=$(go env GOMOD)"
          } >>"$GITHUB_OUTPUT"

      - name: Go caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.goenv.outputs.cache }}
            ${{ steps.goenv.outputs.modcache }}
          key: ${{ github.job }}-${{ runner.os }}-go-${{ hashFiles(steps.goenv.outputs.mod) }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-go-

      - name: Run unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          task --yes unit-race
        env:
          CGO_ENABLED: 1 # needed for race checker

      - name: Run golden tests
        id: golden
        continue-on-error: true
        shell: bash
        run: |
          task --yes golden

      - name: Check test results
        if: steps.unit.outcome == 'failure' || steps.golden.outcome == 'failure'
        run: exit 1

  integration:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-ubuntu24.04-standard' }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [STAGING, STABLE]
    env:
      TASK_X_REMOTE_TASKFILES: 1
      UNIKRAFT_SERVER_STAGING: staging
      UNIKRAFT_SERVER_STABLE: stable
      UNIKRAFT_SERVER_PROD: prod
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - name: Authenticate git for remote Taskfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # Multi-platform rootfs builds run the target architecture's binaries,
      # which needs a binfmt handler registered with the kernel.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set Go variables
        id: goenv
        run: |
          {
            echo "cache=$(go env GOCACHE)"
            echo "modcache=$(go env GOMODCACHE)"
            echo "mod=$(go env GOMOD)"
          } >>"$GITHUB_OUTPUT"

      - name: Go caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.goenv.outputs.cache }}
            ${{ steps.goenv.outputs.modcache }}
          key: ${{ github.job }}-${{ runner.os }}-go-${{ hashFiles(steps.goenv.outputs.mod) }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-go-

      - name: Run integration tests (without auth)
        if: ${{ !(github.event_name == 'push' || !github.event.pull_request.head.repo.fork) }}
        shell: bash
        run: |
          task --yes integration
        env:
          UNIKRAFT_X_TEST_SERVER: ${{ env[format('UNIKRAFT_CONFIG_{0}', matrix.target)] }}

      - name: Run integration tests (with auth)
        if: ${{ github.event_name == 'push' || !github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          mkdir -p ~/.config/unikraft
          cat <<EOF > ~/.config/unikraft/config.yaml
          profile: default
          profiles:
            default:
              type: cloud
              name: default
              organization: ${UNIKRAFT_ORG}
              token: ${UNIKRAFT_TOKEN}
              metros:
                - name: ${UNIKRAFT_X_TEST_SERVER}
                  endpoint: ${UNIKRAFT_ENDPOINT}
                  location: fra
                  insecure: true
          EOF
          task --yes integration
        env:
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
          UNIKRAFT_ENDPOINT: ${{ secrets[format('UNIKRAFT_ENDPOINT_{0}', matrix.target)] }}
          UNIKRAFT_X_TEST_SERVER: ${{ env[format('UNIKRAFT_SERVER_{0}', matrix.target)] }}

  integration-prod:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-ubuntu24.04-standard' }}
    needs: integration
    env:
      TASK_X_REMOTE_TASKFILES: 1
      UNIKRAFT_SERVER_PROD: prod
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
      - name: Authenticate git for remote Taskfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # Multi-platform rootfs builds run the target architecture's binaries,
      # which needs a binfmt handler registered with the kernel.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set Go variables
        id: goenv
        run: |
          {
            echo "cache=$(go env GOCACHE)"
            echo "modcache=$(go env GOMODCACHE)"
            echo "mod=$(go env GOMOD)"
          } >>"$GITHUB_OUTPUT"

      - name: Go caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.goenv.outputs.cache }}
            ${{ steps.goenv.outputs.modcache }}
          key: ${{ github.job }}-${{ runner.os }}-go-${{ hashFiles(steps.goenv.outputs.mod) }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-go-

      - name: Run integration tests (without auth)
        if: ${{ !(github.event_name == 'push' || !github.event.pull_request.head.repo.fork) }}
        shell: bash
        run: |
          task --yes integration
        env:
          UNIKRAFT_X_TEST_SERVER: ${{ env['UNIKRAFT_CONFIG_PROD'] }}

      - name: Run integration tests (with auth)
        if: ${{ github.event_name == 'push' || !github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          mkdir -p ~/.config/unikraft
          cat <<EOF > ~/.config/unikraft/config.yaml
          profile: default
          profiles:
            default:
              type: cloud
              name: default
              organization: ${UNIKRAFT_ORG}
              token: ${UNIKRAFT_TOKEN}
              metros:
                - name: ${UNIKRAFT_X_TEST_SERVER}
                  endpoint: ${UNIKRAFT_ENDPOINT}
                  location: fra
                  insecure: true
          EOF
          task --yes integration
        env:
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
          UNIKRAFT_ENDPOINT: ${{ secrets.UNIKRAFT_ENDPOINT_PROD }}
          UNIKRAFT_X_TEST_SERVER: ${{ env.UNIKRAFT_SERVER_PROD }}

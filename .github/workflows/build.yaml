name: build

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - prod-staging
    paths:
    - '**'
    - '!.github/**'
    - '.github/workflows/build.yaml'
    - '!README.md'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - GOOS: darwin
          GOARCH: amd64
        - GOOS: darwin
          GOARCH: arm64
        - GOOS: linux
          GOARCH: amd64
        - GOOS: linux
          GOARCH: arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Set Go variables
      id: goenv
      run: |
        {
          echo "cache=$(go env GOCACHE)"
          echo "modcache=$(go env GOMODCACHE)"
          echo "mod=$(go env GOMOD)"
        } >>"$GITHUB_OUTPUT"

    - name: Go caches
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
        key: ${{ github.job }}-${{ runner.os }}-go-${{ hashFiles(steps.goenv.outputs.mod) }}
        restore-keys: |
          ${{ github.job }}-${{ runner.os }}-go-

    - name: Install Task
      uses: go-task/setup-task@v2

    - name: Build
      shell: bash
      env:
        TASK_X_REMOTE_TASKFILES: 1
      run: |
        VERSION=pr-${{ github.event.number }} GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} task --yes cli

    - name: Upload build artifacts to GitHub
      uses: actions/upload-artifact@v7
      if: github.event_name == 'push'
      with:
        name: unikraft-cli-${{ matrix.GOOS }}-${{ matrix.GOARCH }}-${{ github.sha }}
        path: ./dist/unikraft
        if-no-files-found: error
        retention-days: 7
        overwrite: true

name: sync sdk
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'The name of the sdk release channel'
        required: true
        default: 'prod-staging'
        type: choice
        options:
          - prod-stable
          - prod-staging

concurrency:
  group: ${{ github.workflow }}-staging-${{ inputs.channel }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: staging

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Bump SDK version
        id: bump-sdk
        shell: bash
        run: |
          echo "Bumping Go SDK to latest from ${{ inputs.channel }}..."
          go get unikraft.com/cloud/sdk@${{ inputs.channel }}
          go mod tidy

      - name: Check for changes in go.mod/go.sum
        id: check-changes
        shell: bash
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "No changes detected. Skipping PR creation."
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in go.mod/go.sum:"
            git diff --stat go.mod go.sum || true
          fi

      - name: Close existing related unmerged bump PRs
        if: steps.check-changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const channel = '${{ inputs.channel }}';
            const currentBranch = `sync/go-sdk-${channel}`;
            const title = `gomod(deps): Bump 'go-sdk' to the latest version`;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'staging',
              per_page: 100,
            });

            for (const pr of pulls) {
              if (pr.title !== title) {
                continue;
              }
              if (pr.head.ref === currentBranch) {
                continue;
              }

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed',
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `Closing in favor of a newer SDK bump PR for channel ${channel}.`,
              });
            }

      - name: Create pull request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          base: staging
          branch: sync/go-sdk-${{ inputs.channel }}
          commit-message: 'gomod(deps): Bump go-sdk to the latest version'
          title: "gomod(deps): Bump 'go-sdk' to the latest version"
          body: |
            This PR was automatically generated by a workflow dispatch.

            It updates `unikraft.com/cloud/sdk` to its latest available version from `${{ inputs.channel }}`.
          committer: Unikraft Bot <monkey@unikraft.io>
          author: Unikraft Bot <monkey@unikraft.io>
          add-paths: |
            go.mod
            go.sum
